# Static-host headers; Express Helmet does not run on Amplify's static responses.
# CSP needs a separately tested policy for Next inline bootstrapping.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Referrer-Policy
        value: no-referrer
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: SAMEORIGIN
